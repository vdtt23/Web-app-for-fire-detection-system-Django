{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Invalid Link – Fili</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.10);
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        .icon { font-size: 48px; margin-bottom: 16px; }
        h2 { font-size: 22px; font-weight: 700; color: #0f172a; margin-bottom: 10px; }
        p { font-size: 14px; color: #64748b; margin-bottom: 24px; line-height: 1.6; }
        a {
            display: inline-block;
            padding: 10px 20px;
            background: #0ea5e9;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }
        a:hover { background: #0284c7; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">❌</div>
        <h2>Invalid or expired link</h2>
        <p>The verification link is invalid or has expired.<br>Please register again to get a new one.</p>
        <a href="/register/">Try Again</a>
    </div>
</body>
</html>
