{% extends "posts/base.html" %}

{% block content %}

<style>
#map {
    position: relative;
    width: 800px;
    height: 500px;
    border: 2px solid #ccc;
    background: #f5f5f5;
}

.node {
    position: absolute;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
}

.safe { background: green; }
.warning { background: orange; }
.fire { background: red; }

.legend { margin-bottom: 10px; }
.box { margin-right: 10px; display: inline-block; }
</style>

<h2>IoT Node Map</h2>

<div class="legend">
    <span class="box">🟢 SAFE</span>
    <span class="box">🟡 WARNING</span>
    <span class="box">🔴 FIRE</span>
</div>

<div id="map"></div>

{% endblock %}

{% block scripts %}
<script>
const MAP_WIDTH = 800;
const MAP_HEIGHT = 500;

function getColor(status) {
    if (status === "FIRE") return "fire";
    if (status === "WARNING") return "warning";
    return "safe";
}

function loadNodes() {
    fetch("/api/nodes/")
        .then(res => res.json())
        .then(nodes => {

            const map = document.getElementById("map");
            map.innerHTML = "";

            console.log("nodes:", nodes);

            nodes.forEach(n => {

                if (n.x == null || n.y == null) return;

                let ratioX = n.x / 100;
                let ratioY = n.y / 100;

                let x = ratioX * MAP_WIDTH;
                let y = ratioY * MAP_HEIGHT;

                x = Math.min(x, MAP_WIDTH - 10);
                y = Math.min(y, MAP_HEIGHT - 10);

                const node = document.createElement("div");
                node.className = "node " + getColor(n.status);

                node.style.left = x + "px";
                node.style.top = y + "px";

                map.appendChild(node);
            });
        })
        .catch(err => console.error(err));
}

setInterval(loadNodes, 2000);
loadNodes();
</script>
{% endblock %}
